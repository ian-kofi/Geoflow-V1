# Render settings for the free GeoFlow demo. To use them, go to render.com, choose New, then Blueprint,
# and pick this repository.
services:
  - type: web
    name: geoflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Free servers have 512 MB of memory, so big areas are processed at lower detail
      - key: GEOFLOW_LOW_MEMORY
        value: "1"
      # and only one heavy step runs at a time (the others wait their turn)
      - key: GEOFLOW_MAX_JOBS
        value: "1"
      - key: GEOFLOW_MAX_UPLOAD_MB
        value: "20"
      # Used when the app is built: shows the "free demo server" note
      - key: VITE_DEMO_NOTICE
        value: "1"
