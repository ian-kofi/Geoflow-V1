# Render Blueprint for the free GeoFlow demo (render.com → New → Blueprint → pick this repository).
services:
  - type: web
    name: geoflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Free instances have 512 MB of memory: process big areas at lower detail…
      - key: GEOFLOW_LOW_MEMORY
        value: "1"
      # …and run one heavy step at a time (others queue).
      - key: GEOFLOW_MAX_JOBS
        value: "1"
      - key: GEOFLOW_MAX_UPLOAD_MB
        value: "20"
      # Build-time: show the "free demo server" notice in the app.
      - key: VITE_DEMO_NOTICE
        value: "1"
